function setSync(st,txt){

function normalize(d){
  d=d&&typeof d==="object"?d:{};
  d.rev=Number(d.rev)||1; d.revDate=d.revDate||today();
  d.machines=Array.isArray(d.machines)&&d.machines.length?d.machines:SEED.machines;
  d.machines.forEach(m=>{m.no=String(m.no); m.items=(m.items||[]).map(it=>({id:it.id||uid(),...it}));});
  d.reqs=d.reqs||[]; d.logs=d.logs||[]; d.checks=d.checks||[];
  d.reqs.forEach(r=>{ if(!Array.isArray(r.changes)) r.changes=[{field:r.field,old:r.old,new:r.new}]; });
  d.ua=d.ua||"2000-01-01T00:00:00.000Z";   /* 없으면 과거 — 서버본이 이기게 */
  return d;
}
const saveLocal=()=>lsSet("pss.data",JSON.stringify(S));
async function sbGet(){
  const r=await fetch(`${SB_URL}/rest/v1/kv_store?key=eq.${KV_KEY}&select=value,updated_at`,
    {headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}});
  if(!r.ok) throw new Error("GET "+r.status);
  const j=await r.json(); return j[0]?j[0].value:null;
}
async function sbPut(d){
  const r=await fetch(`${SB_URL}/rest/v1/kv_store?on_conflict=key`,{method:"POST",
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",
             Prefer:"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify({key:KV_KEY,value:d,updated_at:nowISO()})});
  if(!r.ok) throw new Error("PUT "+r.status);
}
async function pull(){
  try{
    const v=await sbGet();
    if(v){const srv=normalize(v); if(!S||new Date(srv.ua)>=new Date(S.ua)){S=srv; saveLocal();}}
    else{ await push(); }
    setSync("ok","서버 연결됨"); return true;
  }catch(e){ setSync("err","서버 연결 실패"); return false; }
}
async function push(){
  S.ua=nowISO(); saveLocal(); setSync("busy","저장 중…");
  try{ await sbPut(S); setSync("ok","저장 완료"); return true; }
  catch(e){ setSync("err","저장 실패 — 이 기기에만 저장됨"); return false; }
}
async function commit(mutate){
  try{const v=await sbGet(); if(v){const srv=normalize(v); if(new Date(srv.ua)>new Date(S.ua)) S=srv;}}catch(e){}
  mutate(); const ok=await push(); render(); return ok;
}

  if(isMob()) $$(".ci").forEach(x=>{ if(["dh","t","w","p"].includes(x.dataset.k)) kbAttach([x],false);
    else if(x.dataset.k==="spm") kbAttach([x],true); });
  $$(".ci").forEach(inp=>{
    inp.oninput=()=>{
      const id=inp.dataset.ci,k=inp.dataset.k,it=itOf(cur,id); if(!it)return;
      const v=inp.value, org=String(it[k]??"");
      edits[id]=edits[id]||{};
      if(v===org) delete edits[id][k]; else edits[id][k]=v;
      if(!Object.keys(edits[id]).length) delete edits[id];
      inp.parentElement.classList.toggle("chg",v!==org);

      const sb=$("#bSave"); if(sb) sb.textContent=`저장 (${n}건)`;
    };
    inp.onkeydown=e=>{ if(e.key==="Escape"){ inp.value=String(itOf(cur,inp.dataset.ci)[inp.dataset.k]??""); inp.oninput(); }
      if(e.key==="Enter"){ e.preventDefault(); const all=$$(".ci"); const i=all.indexOf(inp); if(all[i+1]) all[i+1].focus(); } };
  });
  $("#fMch").onchange=e=>{cur=mOf(e.target.value); lsSet("pss.machine",cur.no); selId=""; qrMode=false; render();};

  $("#fGo").onclick=go; $("#fPn").onkeydown=e=>{if(e.key==="Enter")go();};
  $("#fMat").onchange=go; $("#fChk").onchange=go;
  bindBar();
}

/* ═══ 모바일 숫자 키패드 ═══
   휴대폰 기본 키보드가 입력칸을 가리거나 숫자 입력이 불편해 앱 내장 패드를 씁니다.
   대상 칸은 readonly로 두고 탭하면 패드가 열립니다(삼성 키보드가 inputmode=none을 무시함). */
const isMob = ()=> innerWidth<=820 || (("ontouchstart" in window) && innerWidth<=1024);
let kbT=null, kbAllowTilde=false;
function kbAttach(sels, tilde){
  if(!isMob()) return;
  sels.forEach(sel=>{
    const el = typeof sel==="string" ? $(sel) : sel;
    if(!el) return;
    /* number 타입은 "403." 같은 중간 입력을 무효로 보고 값을 비우므로 text로 바꾼다 */
    if(el.tagName==="INPUT" && el.type==="number") el.type="text";
    el.readOnly=true; el.classList.add("kbi");
    el.dataset.kbTilde = tilde?"1":"0";
    el.addEventListener("click",()=>kbOpen(el));
    el.addEventListener("focus",()=>kbOpen(el));
  });
}
function kbOpen(el){
  kbT=el; kbAllowTilde = el.dataset.kbTilde==="1";
  const lab = (el.closest(".fld")?.querySelector("label")?.textContent||"").replace(/\s+/g," ").trim()
            || (el.dataset.k?(FIELDS[el.dataset.k]||el.dataset.k):"값 입력");
  let k=$("#kb");
  if(!k){ k=document.createElement("div"); k.id="kb"; k.className="kb"; document.body.appendChild(k);
          const pad=document.createElement("div"); pad.className="kbpad"; document.body.appendChild(pad); }
  k.innerHTML = `<div class="kb-hd"><b>${esc(lab.split("(")[0].trim())}</b>
      <span class="v" id="kbV">${esc(el.value||"—")}</span></div>
    <div class="kb-g">
      <button data-kb="7">7</button><button data-kb="8">8</button><button data-kb="9">9</button>
      <button class="fn del" data-kb="bs">← 지움</button>
      <button data-kb="4">4</button><button data-kb="5">5</button><button data-kb="6">6</button>
      ${kbAllowTilde?`<button class="fn" data-kb="~">~</button>`:`<button class="fn" data-kb="clr">전체<br>삭제</button>`}
      <button data-kb="1">1</button><button data-kb="2">2</button><button data-kb="3">3</button>
      <button class="fn" data-kb=".">.</button>
      <button data-kb="0">0</button><button data-kb="00">00</button>
      ${kbAllowTilde?`<button class="fn" data-kb="clr">전체<br>삭제</button>`:`<button class="fn" data-kb="-">-</button>`}
      <button class="ok" data-kb="ok">확인</button>
    </div>`;
  document.body.classList.add("kb-on");
  k.onclick=e=>{ const b=e.target.closest("[data-kb]"); if(!b) return; kbKey(b.dataset.kb); };
  el.blur();
  setTimeout(()=>{ try{ el.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} },60);
}
function kbClose(){
  const k=$("#kb"); if(k) k.remove();
  const pd=document.querySelector(".kbpad"); if(pd) pd.remove();
  document.body.classList.remove("kb-on"); kbT=null;
}
function kbKey(key){
  if(!kbT) return kbClose();
  if(key==="ok") { kbT.dispatchEvent(new Event("change",{bubbles:true})); return kbClose(); }
  let v=kbT.value||"";
  if(key==="bs") v=v.slice(0,-1);
  else if(key==="clr") v="";
  else if(key==="."){ if(!/\.\d*$/.test(v.split("~").pop())) v+="."; }
  else if(key==="~"){ if(v && !v.includes("~")) v+="~"; }
  else if(key==="-"){ if(!v) v="-"; }
  else v+=key;
  kbT.value=v;
  const vv=$("#kbV"); if(vv) vv.textContent=v||"—";
  kbT.dispatchEvent(new Event("input",{bubbles:true}));
}
/* 패드 밖을 누르면 닫기 */
document.addEventListener("click",e=>{
  if(!$("#kb")) return;
  if(e.target.closest("#kb")||e.target.closest(".kbi")) return;
  kbT&&kbT.dispatchEvent(new Event("change",{bubbles:true})); kbClose();
},true);
window.addEventListener("resize",()=>{ if(!isMob()&&$("#kb")) kbClose(); });

const closeModal=()=>{ if(typeof kbClose==="function") kbClose(); $("#modalHost").innerHTML=""; };

}
function openCheck(mno,itemId){
  const m=mOf(mno),it=itOf(m,itemId); if(!it)return;
  openModal(`세팅 점검 · ${esc(m.no)}호기`,
    `<div class="info">기종 <b>${esc(it.name)}</b> · 표준 다이하이트 <b>${esc(it.dh)}</b> mm (허용 ±${TOL})</div>
     <div class="fld"><label>실측 다이하이트 (mm) <span style="color:var(--red)">*</span></label>
       <input id="ckv" type="number" step="0.1" inputmode="decimal" placeholder="예: ${esc(it.dh)}"></div>
     <div id="ckJ"></div>
     <div class="row2">
       <div class="fld"><label>실제 피치P <span class="muted">(표준 ${esc(it.p)||"—"})</span></label>
         <input id="ckp" placeholder="${esc(it.p)||"미기록"}"></div>
       <div class="fld"><label>실제 SPM <span class="muted">(표준 ${esc(it.spm)||"—"})</span></label>
         <input id="cks" placeholder="${esc(it.spm)||"미기록"}"></div>
     </div>
     <div id="ckD"></div>
     <div class="fld"><label>비고</label><input id="ckn" placeholder="금형 교체 후 초물 확인 등"></div>`,
    `<button onclick="closeModal()">취소</button><button class="p" id="ckS">기록 저장</button>`);
  const std=parseFloat(it.dh);
  const judge=()=>{const v=parseFloat($("#ckv").value),j=$("#ckJ");
    if(isNaN(v)||isNaN(std)){j.innerHTML="";return null;}
    const dev=Math.round((v-std)*100)/100,ok=Math.abs(dev)<=TOL+1e-9;
    j.innerHTML=`<div class="judge ${ok?"o":"n"}"><span>${ok?"✓ 합격":"✕ 불합격 — 재조정 필요"}</span>
      <small>편차 ${dev>0?"+":""}${dev.toFixed(2)}mm / 허용 ±${TOL}</small></div>`;
    return {dev,ok};};
  const diffChk=()=>{
    const pv=($("#ckp").value||"").trim(), sv=($("#cks").value||"").trim();
    const d=[];
    if(pv && pv!==String(it.p??"")) d.push(`피치 표준 ${it.p||"—"} → 실제 ${pv}`);
    if(sv && sv!==String(it.spm??"")) d.push(`SPM 표준 ${it.spm||"—"} → 실제 ${sv}`);
    $("#ckD").innerHTML = d.length
      ? `<div class="judge n" style="font-size:13px"><span>⚠ 표준과 다름</span><small>${esc(d.join(" · "))} — 표준값을 바꿔야 하면 저장 후 [수정요청]을 올리세요</small></div>` : "";
  };
  $("#ckv").addEventListener("input",judge);
  $("#ckp").addEventListener("input",diffChk);
  $("#cks").addEventListener("input",diffChk);
  $("#ckS").onclick=async()=>{
    const v=parseFloat($("#ckv").value);
    if(isNaN(v))return alert("실측값을 입력하세요.");
    if(!auth) return needLogin();
    const r=judge();
    $("#ckS").disabled=true;
    await commit(()=>{S.checks.unshift({id:uid(),ts:nowISO(),mno:String(mno),itemId,itemName:it.name,std:it.dh,
      actual:String(v),dev:r.dev.toFixed(2),ok:r.ok,by:me,note:$("#ckn").value.trim(),
      pStd:String(it.p??""),pAct:($("#ckp").value||"").trim(),
      sStd:String(it.spm??""),sAct:($("#cks").value||"").trim()});
      if(S.checks.length>1500) S.checks.length=1500;});
    closeModal();
    if(!r.ok) setTimeout(()=>{if(confirm("불합격으로 기록했습니다.\n표준값 자체를 바꿔야 한다면 수정요청을 올리시겠습니까?")) openReq(mno,itemId,"dh",String(v));},100);
  };
  kbAttach(["#ckv","#ckp"],false); kbAttach(["#cks"],true);
  if(!isMob()) setTimeout(()=>$("#ckv").focus(),50);
}
function openReq(mno,itemId,preField,preVal){
  const m=mOf(mno),it=itOf(m,itemId); if(!it)return;
  const F=[["dh","다이하이트 (mm)"],["mat","재질"],["t","두께T (mm)"],
           ["w","폭W (mm)"],["p","피치P (mm)"],["spm","최대SPM"]];

    `<div class="info">기종 <b>${esc(it.name)}</b> · 바꿀 항목만 고치세요. 건드리지 않은 항목은 그대로 둡니다.
      <br>품질 승인 후 표준서에 반영되고 개정번호가 올라갑니다.</div>
     ${F.map(([k,lbl])=>`<div class="fld rqf">
        <label>${lbl} <span class="muted">현재 ${esc(String(it[k]??"")||"—")}</span></label>
        <input id="rq_${k}" data-k="${k}" value="${esc(k===preField&&preVal!=null?preVal:String(it[k]??""))}"></div>`).join("")}
     <div id="rqSum"></div>
     <div class="fld"><label>변경 사유 <span style="color:var(--red)">*</span></label>
       <textarea id="rqr" placeholder="예) 금형 재연마로 다이하이트 상승 — 초물 실측 3회 평균"></textarea></div>`,
    `<button onclick="closeModal()">취소</button><button class="p" id="rqS">요청 등록</button>`);
  const diff=()=>{
    const d=[];
    F.forEach(([k,lbl])=>{
      const inp=$("#rq_"+k), nv=(inp.value||"").trim(), ov=String(it[k]??"");
      const chg=nv!==ov;
      inp.style.background = chg?"#FFF6DB":"";
      inp.style.borderColor = chg?"var(--amber)":"";
      inp.style.fontWeight = chg?"700":"";
      if(chg) d.push({k,lbl:FIELDS[k]||k,old:ov,nv});
    });
    $("#rqSum").innerHTML = d.length
      ? `<div class="info" style="border-left-color:var(--amber)"><b>변경 ${d.length}건</b><br>${

      : `<div class="info">아직 바꾼 항목이 없습니다.</div>`;
    return d;
  };
  F.forEach(([k])=>$("#rq_"+k).addEventListener("input",diff));
  kbAttach(["#rq_dh","#rq_t","#rq_w","#rq_p"],false); kbAttach(["#rq_spm"],true);
  diff();
  $("#rqS").onclick=async()=>{
    const d=diff(), rs=$("#rqr").value.trim();

    if(d.some(x=>x.k==="dh"&&(!x.nv||isNaN(parseFloat(x.nv))))) return alert("다이하이트는 숫자로 입력하세요.");
    if(!rs) return alert("변경 사유는 필수입니다.");

    $("#rqS").disabled=true;
    await commit(()=>{S.reqs.unshift({id:uid(),ts:nowISO(),by:me,mno:String(mno),itemId,itemName:it.name,
      changes:d.map(x=>({field:x.k,old:x.old,new:x.nv})),reason:rs,status:"pending"});});
    closeModal();
    alert(`수정요청 ${d.length}건을 등록했습니다.\n품질 승인 후 표준서에 반영됩니다.`);
  };
}

async function decide(reqId,ok){
  if(!isAdmin())return alert("승인 권한이 없습니다. 승인자 PIN으로 로그인하세요.");
  const r=S.reqs.find(x=>x.id===reqId); if(!r||r.status!=="pending")return;
  const lines=(r.changes||[]).map(c=>`${FIELDS[c.field]||c.field}: ${c.old||"—"} → ${c.new||"—"}`).join("\n");
  const msg=ok?`승인하면 표준서에 반영되고 개정번호가 ${revNo(S.rev+1)} 로 올라갑니다.\n\n${r.mno}호기 ${r.itemName}\n${lines}\n\n진행할까요?`
              :"이 요청을 반려합니다. 진행할까요?";
  if(!confirm(msg))return;
  await commit(()=>{
    const rr=S.reqs.find(x=>x.id===reqId); if(!rr||rr.status!=="pending")return;
    rr.status=ok?"approved":"rejected"; rr.appBy=(auth&&auth.name)||me||"관리자"; rr.appTs=nowISO();
    if(ok){
      const mm=mOf(rr.mno),ii=itOf(mm,rr.itemId); if(!ii)return;
      S.rev=S.rev+1; S.revDate=today();
      (rr.changes||[]).forEach(c=>{
        const old=String(ii[c.field]??""); ii[c.field]=c.new;
        S.logs.unshift({id:uid(),ts:nowISO(),rev:S.rev,act:"req",mno:rr.mno,itemId:rr.itemId,itemName:rr.itemName,
          field:FIELDS[c.field]||c.field,old,new:c.new,reason:rr.reason,by:rr.by,appBy:rr.appBy,reqId:rr.id});
      });
    }});
  alert(ok?`반영 완료 — ${revNo(S.rev)}`:"반려 처리했습니다.");
}

  openModal(`${isNew?"기종 추가":"기종 수정"} · ${esc(m.no)}호기`,
    `<div class="info">${isNew?`<b>${esc(m.maker)} ${esc(m.ton)}톤 ${esc(m.no)}호기</b> 에 새 기종을 등록합니다.`
       :`기종 <b>${esc(it.name)}</b> 의 세팅조건을 직접 수정합니다.`}
     <br>저장하면 개정번호가 ${revNo(S.rev+1)} 로 올라가고 개정이력에 기록됩니다.</div>
     <div class="fld"><label>기종명(품번) <span style="color:var(--red)">*</span></label>
       <input id="itname" value="${esc(it?it.name:"")}" placeholder="예) 1853-515-1"></div>
     <div class="row2">
       <div class="fld"><label>다이하이트 (mm) <span style="color:var(--red)">*</span></label>
         <input id="itdh" type="number" step="0.1" inputmode="decimal" value="${esc(it?it.dh:"")}"></div>
       <div class="fld"><label>재질</label><input id="itmat" value="${esc(it?it.mat:"")}" placeholder="SPCC · 304-2B"></div>
     </div>
     <div class="row2">
       <div class="fld"><label>두께T (mm)</label><input id="itt" value="${esc(it?it.t:"")}"></div>
       <div class="fld"><label>폭W (mm)</label><input id="itw" value="${esc(it?it.w:"")}"></div>
     </div>
     <div class="row2">
       <div class="fld"><label>피치P (mm)</label><input id="itp" value="${esc(it?it.p:"")}" placeholder="자동 가능"></div>
       <div class="fld"><label>최대SPM</label><input id="itspm" value="${esc(it?it.spm:"")}" placeholder="30~35"></div>
     </div>
     <div class="fld"><label>${isNew?"등록":"변경"} 사유 <span style="color:var(--red)">*</span></label>
       <textarea id="itr" placeholder="${isNew?"예) 신규 금형 입고 — 초물 세팅조건 확정":"예) 금형 재연마로 다이하이트 상승 — 초물 실측 3회 평균"}"></textarea></div>`,
    `<button onclick="closeModal()">취소</button><button class="p" id="itS">${isNew?"등록":"저장"}</button>`);
  $("#itS").onclick=async()=>{
    const v={}; ITF.forEach(([k])=>{ v[k]=($("#it"+k).value||"").trim(); });
    const rs=$("#itr").value.trim();
    if(!v.name) return alert("기종명을 입력하세요.");
    if(!v.dh) return alert("다이하이트를 입력하세요.");
    if(isNaN(parseFloat(v.dh))) return alert("다이하이트는 숫자로 입력하세요.");
    if(!rs) return alert(isNew?"등록 사유는 필수입니다.":"변경 사유는 필수입니다.");
    if(!auth) return needLogin();
    const dup=m.items.find(x=>x.name===v.name && x.id!==itemId);
    if(dup && !confirm(`같은 기종명이 이미 있습니다.\n그래도 ${isNew?"등록":"저장"}할까요?`)) return;
    $("#itS").disabled=true;
    await commit(()=>{
      const mm=mOf(mno); if(!mm) return;
      S.rev=S.rev+1; S.revDate=today();
      const stamp={ts:nowISO(),rev:S.rev,mno:String(mno),reason:rs,by:me,appBy:me};
      if(isNew){
        const nid="M"+mno+"-"+uid();
        mm.items.push({id:nid,...v});
        S.logs.unshift({id:uid(),...stamp,act:"add",itemId:nid,itemName:v.name,field:"기종 등록",
          old:"",new:`DH ${v.dh} · ${v.mat||"-"} · ${v.t||"-"}T · W${v.w||"-"} · P${v.p||"-"} · ${v.spm||"-"} SPM`});
      }else{
        const ii=itOf(mm,itemId); if(!ii) return;
        let n=0;
        ITF.forEach(([k,lbl])=>{
          const ov=String(ii[k]??""); if(ov===v[k]) return;
          ii[k]=v[k]; n++;
          S.logs.unshift({id:uid(),...stamp,act:"edit",itemId,itemName:v.name,
            field:(k==="name"?"기종명":FIELDS[k]||k),old:ov,new:v[k]});
        });
        if(!n){ S.rev=S.rev-1; }   /* 바뀐 값 없으면 개정번호 되돌림 */
      }
    });
    closeModal();
  };
  kbAttach(["#itdh","#itt","#itw","#itp"],false); kbAttach(["#itspm"],true);
  if(!isMob()) setTimeout(()=>$("#itname").focus(),60);
}

/* ═══ 관리자 : 기종 삭제 ═══ */
function delItem(mno,itemId){
  if(!canEdit()) return alert("수정 권한이 없습니다. PIN으로 로그인하세요.");
  const m=mOf(mno), it=itOf(m,itemId); if(!it) return;
  const ck=S.checks.filter(c=>c.mno===String(mno)&&c.itemId===itemId).length;
  openModal(`기종 삭제 · ${esc(m.no)}호기`,
    `<div class="judge n">✕ 표준서에서 삭제합니다<small>개정번호 ${revNo(S.rev+1)}</small></div>
     <div class="info">기종 <b>${esc(it.name)}</b> · 다이하이트 <b>${esc(it.dh)}</b> mm
       <br>${ck?`이 기종의 점검기록 <b>${ck}</b>건은 삭제되지 않고 그대로 보존됩니다.`:"점검기록이 없는 기종입니다."}</div>
     <div class="fld"><label>삭제 사유 <span style="color:var(--red)">*</span></label>
       <textarea id="dlr" placeholder="예) 금형 폐기 — 단종 기종"></textarea></div>`,
    `<button onclick="closeModal()">취소</button><button class="p" id="dlS" style="background:var(--red);border-color:var(--red)">삭제</button>`);
  $("#dlS").onclick=async()=>{
    const rs=$("#dlr").value.trim();
    if(!rs) return alert("삭제 사유는 필수입니다.");
    if(!auth) return needLogin();
    if(!confirm(`${it.name} 을 표준서에서 삭제합니다.\n진행할까요?`)) return;
    $("#dlS").disabled=true;
    await commit(()=>{
      const mm=mOf(mno); if(!mm) return;
      const i=mm.items.findIndex(x=>x.id===itemId); if(i<0) return;
      const old=mm.items[i];
      mm.items.splice(i,1);
      S.reqs.forEach(r=>{ if(r.itemId===itemId&&r.status==="pending"){r.status="rejected"; r.appBy=me; r.appTs=nowISO();} });
      S.rev=S.rev+1; S.revDate=today();
      S.logs.unshift({id:uid(),ts:nowISO(),rev:S.rev,act:"del",mno:String(mno),itemId,itemName:old.name,
        field:"기종 삭제",old:`DH ${old.dh} · ${old.mat||"-"} · ${old.t||"-"}T · W${old.w||"-"} · ${old.spm||"-"} SPM`,
        new:"",reason:rs,by:me,appBy:me});
      if(selId===itemId) selId="";
    });
    closeModal();
  };
}

/* ═══ 관리자 : 설비 관리 ═══ */
function openMachine(){
  if(!canEdit()) return alert("수정 권한이 없습니다. PIN으로 로그인하세요.");
  const rows=S.machines.map(m=>`<tr><td><b>${esc(m.no)}호기</b></td><td>${esc(m.maker)}</td>
      <td class="num">${esc(m.ton)}톤</td><td class="num">${m.items.length}종</td>
      <td><button class="s d" data-mdel="${esc(m.no)}"${m.items.length?' title="등록 기종을 먼저 삭제하세요"':""}>삭제</button></td></tr>`).join("");
  openModal("설비 관리",
    `<div class="info">프레스를 추가하거나 삭제합니다. 추가 후 [기종 추가]로 세팅조건을 등록하세요.
      <br>기종이 등록된 설비는 삭제되지 않습니다.</div>
     <div class="fl" style="margin-bottom:12px">
       <input id="mno" placeholder="호기 (예: 50)" style="min-width:96px">
       <input id="mmk" placeholder="제조사 (예: 심팩)" style="min-width:110px">
       <input id="mtn" placeholder="톤수 (예: 300)" style="min-width:96px">
       <button class="g" id="mAdd">＋ 설비 추가</button></div>
     <div class="tw" style="max-height:44vh"><table><thead><tr><th>호기</th><th>제조사</th>
       <th class="num">톤수</th><th class="num">등록기종</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`,
    `<button onclick="closeModal()">닫기</button>`);
  kbAttach(["#mno","#mtn"],false);
  $("#mAdd").onclick=async()=>{
    const no=$("#mno").value.trim(), mk=$("#mmk").value.trim(), tn=$("#mtn").value.trim();
    if(!no||!mk||!tn) return alert("호기 · 제조사 · 톤수를 모두 입력하세요.");
    if(!/^\d+$/.test(no)) return alert("호기는 숫자로 입력하세요.");
    if(mOf(no)) return alert(no+"호기는 이미 등록되어 있습니다.");
    if(!auth) return needLogin();
    $("#mAdd").disabled=true;
    await commit(()=>{
      S.machines.push({no:String(no),maker:mk,ton:tn,items:[]});
      S.machines.sort((a,b)=>(+a.no||999)-(+b.no||999));
      S.rev=S.rev+1; S.revDate=today();
      S.logs.unshift({id:uid(),ts:nowISO(),rev:S.rev,act:"mach",mno:String(no),itemId:"",itemName:"—",
        field:"설비 등록",old:"",new:`${mk} ${tn}톤 ${no}호기`,reason:"설비 신규 등록",by:me,appBy:me});
    });
    closeModal(); openMachine();
  };
  $$("[data-mdel]").forEach(b=> b.onclick=async()=>{
    const no=b.dataset.mdel, m=mOf(no);
    if(m.items.length) return alert(`${no}호기에 기종 ${m.items.length}종이 등록되어 있습니다.\n기종을 먼저 삭제하세요.`);
    if(!confirm(`${no}호기를 설비 목록에서 삭제합니다.\n진행할까요?`)) return;
    await commit(()=>{
      const i=S.machines.findIndex(x=>x.no===no); if(i<0) return;
      const old=S.machines[i]; S.machines.splice(i,1);
      S.rev=S.rev+1; S.revDate=today();
      S.logs.unshift({id:uid(),ts:nowISO(),rev:S.rev,act:"mach",mno:no,itemId:"",itemName:"—",
        field:"설비 삭제",old:`${old.maker} ${old.ton}톤 ${no}호기`,new:"",reason:"설비 삭제",by:me,appBy:me});
      if(cur&&cur.no===no) cur=S.machines[0];
    });
    closeModal(); openMachine();
  });
}

/* ═══════════ CSV ═══════════ */
function csvDown(name,header,rows){
  const q=v=>{const s=String(v??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const body=[header,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+body],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${name}_${today()}.csv`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
}
function exportCsv(){
  if(view==="std"){const m=cur;
    csvDown(`세팅표준_${m.no}호기`,["No","기종명","다이하이트","재질","두께T","폭W","피치P","최대SPM","최근점검"],
      m.items.map((it,i)=>{const c=lastCheck(m.no,it.id);
        return [i+1,it.name,it.dh,it.mat,it.t,it.w,it.p,it.spm,c?`${c.ok?"OK":"NG"} ${c.actual} (${fmtTs(c.ts)})`:""];}));
  }else if(view==="search"){
    const k=sq.trim().toLowerCase(),rows=[];
    S.machines.forEach(m=>m.items.forEach(it=>{if(k&&(it.name+" "+it.mat).toLowerCase().includes(k))
      rows.push([m.no,`${m.maker} ${m.ton}톤`,it.name,it.dh,it.mat,it.t,it.w,it.p,it.spm]);}));
    csvDown("품번별조회",["호기","설비","기종명","다이하이트","재질","두께T","폭W","피치P","최대SPM"],rows);
  }else if(view==="req"){
    const rows=[];
    S.reqs.forEach(r=>(r.changes||[]).forEach(c=>rows.push([fmtTs(r.ts),r.mno,r.itemName,
      FIELDS[c.field]||c.field,c.old,c.new,r.reason,r.by,
      r.status==="pending"?"대기":r.status==="approved"?"승인":"반려",r.appBy||"",r.appTs?fmtTs(r.appTs):""])));
    csvDown("수정요청",["요청일시","호기","기종명","항목","현재값","변경값","변경사유","요청자","상태","승인자","처리일시"],rows);
  }else if(view==="check"){
    csvDown("세팅점검기록",["점검일시","호기","기종명","표준DH","실측DH","편차","판정",
        "표준피치","실제피치","표준SPM","실제SPM","점검자","비고"],
      S.checks.map(c=>[fmtTs(c.ts),c.mno,c.itemName,c.std,c.actual,c.dev,c.ok?"합격":"불합격",
        c.pStd||"",c.pAct||"",c.sStd||"",c.sAct||"",c.by,c.note||""]));
  }else if(view==="hist"){
    const AT={add:"신규",del:"삭제",edit:"수정",mach:"설비",req:"요청승인"};
    csvDown("개정이력",["개정","반영일시","구분","호기","기종명","항목","변경전","변경후","변경사유","요청자","처리자"],
      S.logs.map(l=>[revNo(l.rev),fmtTs(l.ts),AT[l.act||"req"]||"요청승인",l.mno,l.itemName,
        FIELDS[l.field]||l.field,l.old,l.new,l.reason,l.by,l.appBy]));
  }
}

/* ═══════════ 이벤트 ═══════════ */
function setView(v){ view=v; lsSet("pss.view",v); closeNav(); render(); scrollTo({top:0}); }
const closeNav=()=>{$("#nav").classList.remove("open"); const m=$(".navmask"); if(m)m.remove();
  $$("#pcTop .navitem").forEach(n=>n.classList.remove("open"));};

document.addEventListener("click",e=>{
  /* PC 메가메뉴 — 터치 기기에서도 열리도록 클릭 토글 */
  const nvb=e.target.closest("#pcTop .navitem>button");
  if(nvb){
    const it=nvb.parentElement, was=it.classList.contains("open");
    $$("#pcTop .navitem").forEach(n=>n.classList.remove("open"));
    if(!was) it.classList.add("open");
    return;
  }
  if(!e.target.closest("#pcTop")) $$("#pcTop .navitem").forEach(n=>n.classList.remove("open"));

  if(e.target.closest("#hamb")){
    const n=$("#nav");
    if(n.classList.contains("open"))return closeNav();
    n.classList.add("open");
    const mk=document.createElement("div"); mk.className="navmask"; mk.onclick=closeNav;
    document.body.appendChild(mk); return;
  }
  if(e.target.closest("#navX")){ closeNav(); return; }

  const a=e.target.closest("a[data-v],a[data-fn]");
  if(a && (a.closest("#pcTop")||a.closest("nav"))){
    if(a.dataset.v) setView(a.dataset.v);
    if(a.dataset.fn) doFn(a.dataset.fn);
    return;
  }
  const rw=e.target.closest("[data-row]");
  if(rw && !e.target.closest("[data-act]")){
    selId=rw.dataset.row;
    $$("[data-row]").forEach(x=>x.classList.toggle("sel",x.dataset.row===selId)); return;
  }
  const b=e.target.closest("[data-act]"); if(!b)return;
  const act=b.dataset.act;
  if(act==="check") openCheck(b.dataset.m,b.dataset.i);
  else if(act==="req") openReq(b.dataset.m,b.dataset.i);
  else if(act==="edit") openItem(b.dataset.m,b.dataset.i);
  else if(act==="del") delItem(b.dataset.m,b.dataset.i);
  else if(act==="approve") decide(b.dataset.r,true);
  else if(act==="reject") decide(b.dataset.r,false);
  else if(act==="go"){cur=mOf(b.dataset.m); lsSet("pss.machine",cur.no); qrMode=false; setView("std");}
});
function doFn(f){ if(f==="print") setTimeout(()=>window.print(),120); else if(f==="csv") setTimeout(exportCsv,120); }

function paintUser(){
  const a1=$("#admin1"), a2=$("#admin2"), w1=$("#who1"), w2=$("#who2");
  if(a1) a1.textContent = auth?"로그아웃":"PIN 로그인";
  if(a2) a2.textContent = auth?"로그아웃":"로그인";
  if(a1) a1.classList.toggle("on",!!auth);
  if(a2) a2.classList.toggle("on",!!auth);
  const lbl = auth?`${esc(auth.name)} · ${ROLET[auth.role]}`:"";
  if(w2) w2.innerHTML = auth?`<b>${esc(auth.name)}</b> ${ROLET[auth.role]}`:"미로그인";
  if(w2) w2.className = "who-t"+(auth?(auth.role==="approver"?" ap":" ed"):"");
  if(w1) w1.innerHTML = auth?`<b>${esc(auth.name)}</b><span>${ROLET[auth.role]}</span>`:"로그인 안 됨";
  if(w1) w1.className = "who-n"+(auth?(auth.role==="approver"?" ap":" ed"):"");
}
function toggleUser(){
  if(auth){ if(!confirm(`${auth.name} 로그아웃할까요?`)) return;
    auth=null; me=""; lsSet("pss.me",""); lsSet("pss.role","");
    if(editMode){editMode=false; edits={};} paintUser(); render(); return; }
  doLogin();
}
$("#admin1").onclick=toggleUser;
$("#admin2").onclick=toggleUser;
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!editMode) pull().then(render);});
window.addEventListener("online",()=>pull().then(render));
window.addEventListener("resize",()=>{if(innerWidth>900) closeNav();});

/* ═══════════ 시작 ═══════════ */
(function boot(){
  let local=null; try{local=JSON.parse(lsGet("pss.data")||"null");}catch(e){}
  S=normalize(local||{rev:1,revDate:today(),machines:SEED.machines,ua:"2000-01-01T00:00:00.000Z"});
  const sn=lsGet("pss.me")||"", sr=lsGet("pss.role")||"";
  if(sn&&sr&&Object.values(ACCOUNTS).some(a=>a.name===sn&&a.role===sr)){ auth={name:sn,role:sr}; me=sn; }
  else { me=""; lsSet("pss.me",""); lsSet("pss.role",""); }   /* 명단에서 빠진 계정 정리 */
  paintUser();
  const qm=new URLSearchParams(location.search).get("m");
  cur=(qm&&mOf(qm))||mOf(lsGet("pss.machine"))||S.machines[0];
  if(qm&&mOf(qm)){qrMode=true; view="std";}
  else{const v=lsGet("pss.view"); if(v&&VIEWS[v]) view=v;}
  setSync("busy","서버 확인 중…");
  render();
  pull().then(render);
  setInterval(()=>{if(!document.hidden&&!editMode) pull().then(render);},120000);
})();
</script>
